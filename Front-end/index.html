<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary -->
  <title>SkillKart — Micro-Freelance Platform for University Students</title>
  <meta name="description"
    content="SkillKart connects university students with real freelance work. Find projects, hire vetted student talent, and build a portfolio that gets you hired." />
  <meta name="author" content="SkillKart" />
  <meta name="theme-color" content="#042E4C" />
  <!-- Vercel also serves this app on an auto-generated *.vercel.app domain;
       without a canonical, both get indexed and split ranking. -->
  <link rel="canonical" href="https://skillkart-fuuast.vercel.app/" />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp)
       og:url and og:image MUST be absolute — crawlers don't resolve relative
       paths, and a relative og:image silently yields no preview card. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SkillKart" />
  <meta property="og:url" content="https://skillkart-fuuast.vercel.app/" />
  <meta property="og:title" content="SkillKart — Micro-Freelance Platform for University Students" />
  <meta property="og:description"
    content="Find freelance projects, hire vetted student talent, and build a portfolio that gets you hired." />
  <meta property="og:image" content="https://skillkart-fuuast.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="SkillKart — micro-freelancing for university students" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SkillKart — Micro-Freelance Platform for University Students" />
  <meta name="twitter:description"
    content="Find freelance projects, hire vetted student talent, and build a portfolio that gets you hired." />
  <meta name="twitter:image" content="https://skillkart-fuuast.vercel.app/og-image.png" />

  <!-- Crawling: per-path rules live in robots.txt; this is the site-wide default. -->
  <meta name="robots" content="index, follow" />

  <!-- Perf: warm up the font origins variables.css pulls from. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
